# =========================================================
# General settings
# =========================================================
GEOMETRY_ONLY_OUTPUT 0           # 形状プレビューのみ出力 (解析を行わない): 0=無効, 1=有効
OUTPUT_GLOBAL_PARAMETERS 0       # グローバルの自然座標の出力OUTPUT_GLOBAL_PARAMETERS 1の時のみ可能: 0=無効, 1=有効
CALC_ON_ELE_VERTEX 1             # 要素頂点での応力等の計算: 0=無効, 1=有効

# =========================================================
# Gaussian quadrature settings
# =========================================================
USE_EXTENDED_QUADRATURE 1        # 拡張ガウス積分を使用する: 0=無効, 1=有効
NUM_GAUSS_POINTS 4               # 通常の積分点数
NUM_GAUSS_POINTS_EXTENDED 10     # 拡張積分点数 (USE_EXTENDED_QUADRATURE=1 の場合に使用)

# =========================================================
# Second inverse mapping: 自然座標の面上の制御点を既知(固定)にする(亀裂面の形状を保つ)
#   ※ 項目の順序で読み込むので、上の項目の後ろに、この順で書くこと
#   面は、グローバルパッチの自然座標空間(ローカルの制御点が定義されている空間)で指定する
#   面上にある制御点(ローカル入力の初期座標がその面の上にあるもの)は、入力の座標のまま動かさない
#   (全成分を既知として解く)
# =========================================================
FIX_PLANE_ENABLE 1               # 面上の制御点を固定する: 0=無効, 1=有効
FIX_PLANE_AXIS 2                 # 面の種類: 0=ξ面, 1=η面, 2=ζ面
FIX_PLANE_POSITION 0.0           # 面に垂直な方向のノット位置 (0.0~1.0, グローバルパッチの定義域に対する割合)